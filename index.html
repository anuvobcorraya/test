<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADDOX User Panel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

.hidden{
    display:none!important;
}

.login-box{
    width:92%;
    max-width:420px;
    margin:70px auto;
    background:#111827;
    border:1px solid #293348;
    padding:28px;
    border-radius:20px;
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#8b95a7;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:13px;
    border-radius:11px;
    border:1px solid #30394d;
    background:#080b12;
    color:white;
    outline:none;
}

button{
    border:0;
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:14px;
    border-radius:11px;
    background:#6366f1;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.create-btn{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:11px;
    background:#1f2937;
    border:1px solid #374151;
    color:white;
}

.google-btn{
    width:100%;
    padding:14px;
    border-radius:11px;
    background:white;
    color:#222;
    font-size:15px;
    font-weight:bold;
}

.or{
    text-align:center;
    color:#737e96;
    margin:18px 0;
}

.status{
    text-align:center;
    margin-top:14px;
    color:#a5b4fc;
    font-size:14px;
    line-height:1.5;
}

.panel{
    width:92%;
    max-width:950px;
    margin:auto;
    padding:20px 0;
}

.header{
    background:#111827;
    border:1px solid #293348;
    padding:18px;
    border-radius:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:22px;
}

.header h1{
    font-size:21px;
}

.header small{
    color:#8b95a7;
}

.logout{
    background:#ef4444;
    color:white;
    padding:10px 15px;
    border-radius:9px;
}

.notification{
    background:#111827;
    border:1px solid #293348;
    border-radius:15px;
    padding:18px;
    margin-bottom:12px;
}

.notification h2{
    font-size:18px;
    margin-bottom:8px;
}

.notification p{
    color:#b9c1d1;
    line-height:1.6;
    white-space:pre-wrap;
}

.date{
    color:#737e96;
    font-size:12px;
    margin-top:12px;
}

</style>

</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginBox" class="login-box">

    <div class="logo">
        MADDOX
    </div>

    <div class="subtitle">
        Welcome Back 👋
    </div>


    <input
        id="email"
        type="email"
        placeholder="Email address"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
    >


    <button
        id="loginBtn"
        class="login-btn"
    >
        Login
    </button>


    <button
        id="createBtn"
        class="create-btn"
    >
        Create New Account
    </button>


    <div class="or">
        OR
    </div>


    <button
        id="googleBtn"
        class="google-btn"
    >
        🔵 Continue with Google
    </button>


    <div id="status" class="status"></div>

</div>


<!-- ================= USER PANEL ================= -->

<div id="userPanel" class="panel hidden">

    <div class="header">

        <div>

            <h1>
                🏠 User Panel
            </h1>

            <small id="userEmail"></small>

        </div>


        <button
            id="logoutBtn"
            class="logout"
        >
            Logout
        </button>

    </div>


    <h2 style="margin-bottom:15px;">
        📢 Latest Notifications
    </h2>


    <div id="notificationList">
        Loading...
    </div>

</div>


<script type="module">


/* ================= FIREBASE ================= */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyABtoI1AIkSpkGrg1P1Sw7-Q5xBB2ZSL6Y",

    authDomain:
    "anurag-33a0a.firebaseapp.com",

    databaseURL:
    "https://anurag-33a0a-default-rtdb.firebaseio.com",

    projectId:
    "anurag-33a0a",

    storageBucket:
    "anurag-33a0a.firebasestorage.app",

    messagingSenderId:
    "239204466277",

    appId:
    "1:239204466277:web:239a0a707e3c7b56b6908c"
};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


const googleProvider =
    new GoogleAuthProvider();


/* ================= ELEMENTS ================= */

const loginBox =
    document.getElementById("loginBox");

const userPanel =
    document.getElementById("userPanel");

const status =
    document.getElementById("status");


/* ================= EMAIL LOGIN ================= */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        status.textContent =
        "❌ Email address দিন।";

        return;
    }


    if(!password){

        status.textContent =
        "❌ Password দিন।";

        return;
    }


    status.textContent =
    "⏳ Logging in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        status.textContent="";

    }

    catch(error){

        console.error(
            "Firebase Login Error:",
            error
        );


        switch(error.code){

            case "auth/invalid-credential":

                status.textContent =
                "❌ Email অথবা password ভুল।";

                break;


            case "auth/user-not-found":

                status.textContent =
                "❌ এই email দিয়ে কোনো account নেই। আগে Create New Account চাপুন।";

                break;


            case "auth/wrong-password":

                status.textContent =
                "❌ Password ভুল।";

                break;


            case "auth/invalid-email":

                status.textContent =
                "❌ Email address সঠিক নয়।";

                break;


            case "auth/too-many-requests":

                status.textContent =
                "⚠️ অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

                break;


            case "auth/network-request-failed":

                status.textContent =
                "❌ Internet connection সমস্যা।";

                break;


            default:

                status.textContent =
                "❌ " + error.message;

        }

    }

});


/* ================= CREATE ACCOUNT ================= */

document
.getElementById("createBtn")
.addEventListener("click", async () => {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        status.textContent =
        "❌ Email address দিন।";

        return;
    }


    if(password.length < 6){

        status.textContent =
        "❌ Password কমপক্ষে 6 characters হতে হবে।";

        return;
    }


    status.textContent =
    "⏳ Creating account...";


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        status.textContent =
        "✅ Account created successfully!";


    }

    catch(error){

        console.error(error);


        switch(error.code){

            case "auth/email-already-in-use":

                status.textContent =
                "⚠️ এই email দিয়ে account আগে থেকেই আছে। Login করুন।";

                break;


            case "auth/weak-password":

                status.textContent =
                "❌ Password কমপক্ষে 6 characters হতে হবে।";

                break;


            case "auth/invalid-email":

                status.textContent =
                "❌ Email address সঠিক নয়।";

                break;


            default:

                status.textContent =
                "❌ " + error.message;

        }

    }

});


/* ================= GOOGLE LOGIN ================= */

document
.getElementById("googleBtn")
.addEventListener("click", async () => {

    status.textContent =
    "⏳ Opening Google Sign-In...";


    try{

        await signInWithPopup(
            auth,
            googleProvider
        );


        status.textContent="";

    }

    catch(error){

        console.error(
            "Google Login Error:",
            error
        );


        switch(error.code){

            case "auth/popup-blocked":

                status.textContent =
                "❌ Browser popup block করেছে। Popup allow করুন।";

                break;


            case "auth/popup-closed-by-user":

                status.textContent =
                "⚠️ Google login window বন্ধ করা হয়েছে।";

                break;


            case "auth/unauthorized-domain":

                status.textContent =
                "❌ এই GitHub Pages domain Firebase Authorized Domains-এ নেই।";

                break;


            case "auth/operation-not-allowed":

                status.textContent =
                "❌ Firebase Console-এ Google Sign-In Enable করুন।";

                break;


            default:

                status.textContent =
                "❌ " + error.message;

        }

    }

});


/* ================= AUTH STATE ================= */

onAuthStateChanged(
    auth,
    (user) => {

        if(user){

            loginBox
            .classList
            .add("hidden");


            userPanel
            .classList
            .remove("hidden");


            document
            .getElementById("userEmail")
            .textContent =
            user.email ||
            "Google User";


            loadNotifications();

        }

        else{

            loginBox
            .classList
            .remove("hidden");


            userPanel
            .classList
            .add("hidden");

        }

    }
);


/* ================= LOGOUT ================= */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

    await signOut(auth);

});


/* ================= NOTIFICATIONS ================= */

function loadNotifications(){

    const notificationRef =
        ref(
            db,
            "notifications"
        );


    onValue(
        notificationRef,
        (snapshot) => {

            const list =
                document
                .getElementById(
                    "notificationList"
                );


            list.innerHTML="";


            if(!snapshot.exists()){

                list.innerHTML =
                "<p>No notifications available.</p>";

                return;
            }


            const data =
                snapshot.val();


            const items =
                Object.values(data)
                .sort(
                    (a,b) =>
                    (b.createdAt || 0) -
                    (a.createdAt || 0)
                );


            items.forEach(item => {

                const box =
                    document
                    .createElement("div");

                box.className =
                    "notification";


                const title =
                    document
                    .createElement("h2");

                title.textContent =
                    item.title || "";


                const message =
                    document
                    .createElement("p");

                message.textContent =
                    item.message || "";


                const date =
                    document
                    .createElement("div");

                date.className =
                    "date";


                if(item.createdAt){

                    date.textContent =
                    new Date(
                        item.createdAt
                    ).toLocaleString();

                }


                box.appendChild(title);

                box.appendChild(message);

                box.appendChild(date);

                list.appendChild(box);

            });

        },

        (error) => {

            console.error(error);

            document
            .getElementById(
                "notificationList"
            )
            .innerHTML =
            "<p>❌ Database permission error.</p>";

        }
    );

}

</script>

</body>
</html>
