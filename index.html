<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADDOX User Panel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

.hidden{
    display:none!important;
}


/* LOGIN */

.login-box{
    width:92%;
    max-width:420px;
    margin:70px auto;
    background:#111827;
    border:1px solid #293348;
    padding:28px;
    border-radius:20px;
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#8b95a7;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:13px;
    border-radius:11px;
    border:1px solid #30394d;
    background:#080b12;
    color:white;
    outline:none;
}

button{
    border:0;
    cursor:pointer;
}


/* EMAIL LOGIN */

.login-btn{
    width:100%;
    padding:14px;
    border-radius:11px;
    background:#6366f1;
    color:white;
    font-size:15px;
    font-weight:bold;
}


/* CREATE ACCOUNT */

.create-btn{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:11px;
    background:#1f2937;
    border:1px solid #374151;
    color:white;
}


/* GOOGLE */

.google-btn{

    width:100%;

    height:50px;

    border-radius:11px;

    background:#ffffff;

    color:#222;

    font-size:15px;

    font-weight:bold;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    transition:0.2s;

}

.google-btn:hover{
    background:#f1f1f1;
}

.google-btn img{

    width:22px;

    height:22px;

    object-fit:contain;

}

.or{
    text-align:center;
    color:#737e96;
    margin:18px 0;
}

.status{
    text-align:center;
    margin-top:14px;
    color:#a5b4fc;
    font-size:14px;
    line-height:1.5;
}


/* USER PANEL */

.panel{
    width:92%;
    max-width:950px;
    margin:auto;
    padding:20px 0;
}

.header{
    background:#111827;
    border:1px solid #293348;
    padding:18px;
    border-radius:17px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:22px;
}

.header h1{
    font-size:21px;
}

.header small{
    color:#8b95a7;
}

.logout{
    background:#ef4444;
    color:white;
    padding:10px 15px;
    border-radius:9px;
}

.notification{
    background:#111827;
    border:1px solid #293348;
    border-radius:15px;
    padding:18px;
    margin-bottom:12px;
}

.notification h2{
    font-size:18px;
    margin-bottom:8px;
}

.notification p{
    color:#b9c1d1;
    line-height:1.6;
    white-space:pre-wrap;
}

.date{
    color:#737e96;
    font-size:12px;
    margin-top:12px;
}

</style>

</head>


<body>


<!-- ================= LOGIN ================= -->

<div id="loginBox" class="login-box">

    <div class="logo">
        MADDOX
    </div>

    <div class="subtitle">
        Welcome Back 👋
    </div>


    <input
        id="email"
        type="email"
        placeholder="Email address"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
    >


    <button
        id="loginBtn"
        class="login-btn"
    >
        Login
    </button>


    <button
        id="createBtn"
        class="create-btn"
    >
        Create New Account
    </button>


    <div class="or">
        OR
    </div>


    <!-- GOOGLE LOGIN -->

    <button
        id="googleBtn"
        class="google-btn"
    >

        <img
            src="https://i.ibb.co.com/M5xRWH0p/google.png"
            alt="Google"
        >

        <span>
            Continue with Google
        </span>

    </button>


    <div
        id="status"
        class="status">
    </div>

</div>



<!-- ================= USER PANEL ================= -->

<div
    id="userPanel"
    class="panel hidden"
>

    <div class="header">

        <div>

            <h1>
                🏠 User Panel
            </h1>

            <small id="userEmail"></small>

        </div>


        <button
            id="logoutBtn"
            class="logout"
        >
            Logout
        </button>

    </div>


    <h2 style="margin-bottom:15px;">
        📢 Latest Notifications
    </h2>


    <div id="notificationList">
        Loading...
    </div>

</div>



<script type="module">


/* ================= FIREBASE ================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,

    signInWithEmailAndPassword,

    createUserWithEmailAndPassword,

    GoogleAuthProvider,

    signInWithRedirect,

    getRedirectResult,

    onAuthStateChanged,

    signOut

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,

    ref,

    onValue

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyABtoI1AIkSpkGrg1P1Sw7-Q5xBB2ZSL6Y",

    authDomain:
    "anurag-33a0a.firebaseapp.com",

    databaseURL:
    "https://anurag-33a0a-default-rtdb.firebaseio.com",

    projectId:
    "anurag-33a0a",

    storageBucket:
    "anurag-33a0a.firebasestorage.app",

    messagingSenderId:
    "239204466277",

    appId:
    "1:239204466277:web:239a0a707e3c7b56b6908c"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


const googleProvider =
    new GoogleAuthProvider();


/*
   Force Google account chooser.
   This makes Google show the account selection screen.
*/

googleProvider.setCustomParameters({
    prompt: "select_account"
});


/* ELEMENTS */

const loginBox =
    document.getElementById("loginBox");

const userPanel =
    document.getElementById("userPanel");

const status =
    document.getElementById("status");


/* ================= EMAIL LOGIN ================= */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        status.textContent =
        "❌ Email address দিন।";

        return;
    }


    if(!password){

        status.textContent =
        "❌ Password দিন।";

        return;
    }


    status.textContent =
    "⏳ Logging in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        status.textContent="";

    }

    catch(error){

        console.error(error);

        status.textContent =
        firebaseError(error.code);

    }

});


/* ================= CREATE ACCOUNT ================= */

document
.getElementById("createBtn")
.addEventListener("click", async () => {

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(!email){

        status.textContent =
        "❌ Email address দিন।";

        return;
    }


    if(password.length < 6){

        status.textContent =
        "❌ Password কমপক্ষে 6 characters হতে হবে।";

        return;
    }


    status.textContent =
    "⏳ Creating account...";


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        status.textContent =
        "✅ Account created successfully!";


    }

    catch(error){

        console.error(error);

        status.textContent =
        firebaseError(error.code);

    }

});


/* ================= GOOGLE LOGIN ================= */

document
.getElementById("googleBtn")
.addEventListener("click", async () => {

    status.textContent =
    "⏳ Opening Google...";


    try{

        /*
          Redirect is more reliable for
          GitHub Pages than popup.
        */

        await signInWithRedirect(
            auth,
            googleProvider
        );

    }

    catch(error){

        console.error(error);

        status.textContent =
        firebaseError(error.code);

    }

});


/* ================= GOOGLE REDIRECT RESULT ================= */

getRedirectResult(auth)
.then((result) => {

    if(result){

        console.log(
            "Google login successful:",
            result.user.email
        );

    }

})
.catch((error) => {

    console.error(
        "Google Redirect Error:",
        error
    );


    status.textContent =
    firebaseError(error.code);

});


/* ================= AUTH STATE ================= */

onAuthStateChanged(
    auth,
    (user) => {

        if(user){

            loginBox
            .classList
            .add("hidden");


            userPanel
            .classList
            .remove("hidden");


            document
            .getElementById("userEmail")
            .textContent =
            user.email ||
            "Google User";


            loadNotifications();

        }

        else{

            loginBox
            .classList
            .remove("hidden");


            userPanel
            .classList
            .add("hidden");

        }

    }
);


/* ================= LOGOUT ================= */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* ================= NOTIFICATIONS ================= */

function loadNotifications(){

    const notificationRef =
        ref(
            db,
            "notifications"
        );


    onValue(
        notificationRef,

        (snapshot) => {

            const list =
                document
                .getElementById(
                    "notificationList"
                );


            list.innerHTML="";


            if(!snapshot.exists()){

                list.innerHTML =
                "<p>No notifications available.</p>";

                return;

            }


            const data =
                snapshot.val();


            const items =
                Object.values(data)
                .sort(
                    (a,b) =>
                    (b.createdAt || 0) -
                    (a.createdAt || 0)
                );


            items.forEach(
                (item) => {

                    const box =
                        document
                        .createElement("div");

                    box.className =
                        "notification";


                    const title =
                        document
                        .createElement("h2");

                    title.textContent =
                        item.title || "";


                    const message =
                        document
                        .createElement("p");

                    message.textContent =
                        item.message || "";


                    const date =
                        document
                        .createElement("div");

                    date.className =
                        "date";


                    if(item.createdAt){

                        date.textContent =
                            new Date(
                                item.createdAt
                            )
                            .toLocaleString();

                    }


                    box.appendChild(title);

                    box.appendChild(message);

                    box.appendChild(date);

                    list.appendChild(box);

                }
            );

        },

        (error) => {

            console.error(error);

            document
            .getElementById(
                "notificationList"
            )
            .innerHTML =
            "<p>❌ Database permission error.</p>";

        }

    );

}


/* ================= ERROR HANDLER ================= */

function firebaseError(code){

    switch(code){

        case "auth/invalid-credential":

            return "❌ Email অথবা password ভুল।";


        case "auth/user-not-found":

            return "❌ এই email দিয়ে account নেই।";


        case "auth/wrong-password":

            return "❌ Password ভুল।";


        case "auth/email-already-in-use":

            return "⚠️ এই email দিয়ে account আগে থেকেই আছে।";


        case "auth/weak-password":

            return "❌ Password কমপক্ষে 6 characters হতে হবে।";


        case "auth/invalid-email":

            return "❌ Email address সঠিক নয়।";


        case "auth/unauthorized-domain":

            return "❌ এই GitHub Pages domain Firebase Authorized Domains-এ যোগ করা হয়নি।";


        case "auth/operation-not-allowed":

            return "❌ Firebase Console থেকে Google Sign-In Enable করা হয়নি।";


        case "auth/network-request-failed":

            return "❌ Internet connection পরীক্ষা করুন।";


        default:

            return "❌ Firebase Error: " + code;

    }

}

</script>

</body>
</html>
